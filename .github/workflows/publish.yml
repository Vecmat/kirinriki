# 通过 GitHub Actions + OIDC 发布到 JSR。
# 前置条件：在 https://jsr.io 的包设置页（Settings）中将本包链接到 GitHub 仓库。
# OIDC 发布无需配置任何 Secret，JSR 会自动生成 SLSA provenance
# 并存入 Sigstore Rekor 透明日志（包页显示 "Built and signed on GitHub Actions"）。
name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC ID token，用于向 JSR 认证
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 已发布过的版本会自动跳过，不会重复发布
      - name: Publish to JSR
        run: deno publish
