# 发布工作流：推送 v* 标签后自动发布到 JSR（自动生成 SLSA provenance）。
#
# 发布流程：
#   1. 本地运行 `npm run release`：自动递增 patch 版本号 → 提交 deno.json/package.json
#      → 打 v{version} 标签 → 推送分支与标签
#   2. 本工作流被 v* 标签推送触发：校验标签与版本一致 → dry-run 校验 → 发布
#
# OIDC 发布无需配置任何 Secret；JSR 自动生成 provenance
# （"Built and signed on GitHub Actions"）。
# 前提：本仓库归属的 GitHub 账号/组织需拥有 jsr.io 上的 @vecmat scope。
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC ID token，用于向 JSR 认证并生成 provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 校验标签版本与 deno.json 版本一致，防止误打标签发布错误版本
      - name: Verify tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version deno.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::标签版本 v$TAG_VERSION 与 deno.json 版本 $PKG_VERSION 不一致"
            exit 1
          fi

      # 完整校验（slow types / ESM / 文档等），失败则中止发布
      - name: Validate publish (dry-run)
        run: deno publish --dry-run

      - name: Publish to JSR
        run: deno publish
